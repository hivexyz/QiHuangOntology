[project]
name = "qihuang-shield"
version = "0.1.0"
description = "QiHuang Shield MVP FastAPI skeleton"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "neo4j>=5.28.0,<6.0.0",
  "rdflib>=7.1.0,<8.0.0",
  "owlready2>=0.47,<1.0.0",
  "pymilvus>=2.5.0,<3.0.0",
  "pypdf>=5.7.0,<6.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0"
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
